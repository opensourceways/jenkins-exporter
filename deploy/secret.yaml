# Jenkins 只读 token：Vault → SecretDefinition 物化为 k8s Secret → 文件卷挂载（不用 envFrom）。
# token 不进环境变量/进程参数，避免 printenv 泄漏。
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-token
  namespace: jenkins-exporter
  annotations:
    # SecretDescription：实际环境由 Vault 经 SecretDefinition CRD 同步物化本 Secret；
    # 此处仅声明形态，不内含真实 token 值（部署时由外部注入）。
    jenkins.io/description: "Jenkins read-only token，由 Vault 同步，文件挂载"
type: Opaque
stringData:
  token: ""
