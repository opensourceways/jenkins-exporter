# SecretDefinition：由 secrets-manager 从 Vault 单向同步 Jenkins 只读 token 成 k8s Secret。
# 与集群既有约定一致（secrets-manager.tuenti.io/v1alpha1）；不要用 external-secrets.io，
# 该 CRD 在社区集群不存在，apply 会失败。
apiVersion: secrets-manager.tuenti.io/v1alpha1
kind: SecretDefinition
metadata:
  name: jenkins-token
  namespace: jenkins-exporter
spec:
  # 物化出的 k8s Secret 名，Deployment 以 secretName: jenkins-token 挂载
  name: jenkins-token
  keysMap:
    # key 即 Secret 的数据键，Deployment 的 items[].key 与之对应
    token:
      # 实际 Vault 路径/字段以平台登记为准
      path: secrets/data/infra-common/jenkins-exporter
      key: jenkins_token
