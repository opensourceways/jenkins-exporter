# SecretDefinition CRD：从 Vault 同步 Jenkins 只读 token 到 k8s Secret（文件卷挂载）。
# 实际 Vault 路径/字段按集群 Vault 实例填写；此处给出声明式形态。
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jenkins-token
  namespace: jenkins-exporter
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: jenkins-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: kv/jenkins-exporter/token
        property: token
