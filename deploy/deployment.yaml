# Deployment：1 副本 + Recreate（RWO PVC 单 Pod 独占）；非 root、只读 rootfs、drop ALL。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-exporter
  namespace: jenkins-exporter
  labels:
    app: jenkins-exporter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jenkins-exporter
  template:
    metadata:
      labels:
        app: jenkins-exporter
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: swr.example.com/opensourceways/jenkins-exporter:latest
          args: []
          ports:
            - name: http
              containerPort: 9300
          envFrom:
            - configMapRef:
                name: jenkins-exporter-config
          env:
            - name: JENKINS_URL
              value: "http://jenkins.jenkins.svc.cluster.local:8080"
            - name: JENKINS_USER
              value: "reader"
            - name: JENKINS_TOKEN_FILE
              value: "/vault/secrets/jenkins-token"
          volumeMounts:
            - name: state
              mountPath: /data
            - name: token
              mountPath: /vault/secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 100Mi
            limits:
              cpu: 200m
              memory: 200Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: jenkins-exporter-state
        - name: token
          secret:
            secretName: jenkins-token
            items:
              - key: token
                path: jenkins-token
